[package]
name = "copygum-app"
version = "1.1.1"
description = "A modern clipboard manager for macOS"
authors = ["CopyGum Team"]
license = "MIT"
edition = "2021"

[lints.rust]
# Suppress cfg warnings from objc crate macros (old version uses deprecated cfg patterns)
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"cargo-clippy\"))"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-dialog = "2.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
image = "0.25"
tokio = { version = "1.48.0", features = ["full"] }
regex = "1.12.2"
fastrand = "2.3.0"
arboard = { version = "3.6.1", features = ["image-data"] }
once_cell = "1.19"
base64 = "0.22"

# macOS-only dependencies
cocoa = "0.26"
objc = "0.2"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
# Optimize for size and performance on macOS
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
