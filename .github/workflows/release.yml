name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App
        run: npm run tauri build -- --bundles msi,nsis

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: CopyGum-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        with:
          name: CopyGum-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CopyGum ${{ github.ref_name }}
          body: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | Windows (MSI) | `CopyGum_${{ steps.version.outputs.VERSION }}_x64_en-US.msi` |
            | Windows (Installer) | `CopyGum_${{ steps.version.outputs.VERSION }}_x64-setup.exe` |

            ### Installation
            - **Windows**: Run the installer (.exe or .msi)

            ### First Launch
            Press `Ctrl+Shift+V` to open CopyGum.
          draft: false
          prerelease: false
          files: |
            artifacts/CopyGum-windows-msi/*.msi
            artifacts/CopyGum-windows-nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
